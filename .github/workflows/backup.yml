# Nightly full backup of the PROSUN INTELLIGENCE / PACE database to Google Drive.
# Runs every night at 23:30 Bangkok time (16:30 UTC), and can be started by hand
# from GitHub > Actions > "Nightly backup to Google Drive" > Run workflow.
#
# Keeps: last 30 daily files + the 1st of each month for 12 months.
# Photos and bill scans (Supabase Storage) are copied to prosun-backups/storage/:
# new files only, and nothing is ever deleted there (photos deleted in Supabase stay in Drive).
# The file is encrypted before it leaves GitHub; nothing is stored in this repo.
#
# Repo secrets needed (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL         Session pooler connection string (Supabase > Connect > Session pooler)
#   BACKUP_ENCRYPTION_KEY   Long random passphrase, kept in the password manager
#   RCLONE_CONF             Output of `rclone config show gdrive` (Google Drive token)
#   SUPABASE_S3_ENDPOINT, SUPABASE_S3_ACCESS_KEY_ID, SUPABASE_S3_SECRET_ACCESS_KEY
#                           Supabase Storage S3 access (Storage > Settings > S3), for photos and bill scans

name: Nightly backup to Google Drive

on:
  schedule:
    - cron: "30 16 * * *"   # 23:30 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRIVE_ROOT: gdrive:prosun-backups
    steps:
      - name: Install PostgreSQL 17 client and rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          curl -fsSL https://rclone.org/install.sh | sudo bash
          /usr/lib/postgresql/17/bin/pg_dump --version
          rclone version | head -n 1

      - name: Write rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone lsd gdrive: > /dev/null   # fails early if the Drive token is wrong

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Bangkok date +%Y-%m-%d)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          # public = app data (orders, weights, payables, CRM...)
          # auth   = user logins
          # storage = list of photos / scans (the files themselves are not in the database)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --compress=9 \
            --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file="prosun-db-$DAY.dump"
          # Check the file is a readable, non-empty dump before uploading it
          /usr/lib/postgresql/17/bin/pg_restore --list "prosun-db-$DAY.dump" > toc.txt
          TABLES=$(grep -c " TABLE DATA public " toc.txt || true)
          echo "Public tables in dump: $TABLES"
          test "$TABLES" -gt 0
          ls -lh "prosun-db-$DAY.dump"

      - name: Encrypt
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_ENCRYPTION_KEY"
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$BACKUP_ENCRYPTION_KEY" \
              --symmetric --cipher-algo AES256 \
              --output "prosun-db-$DAY.dump.gpg" "prosun-db-$DAY.dump"
          shred -u "prosun-db-$DAY.dump"

      - name: Upload to Google Drive
        run: |
          set -euo pipefail
          rclone copy "prosun-db-$DAY.dump.gpg" "$DRIVE_ROOT/daily/"
          # On the 1st of the month, also keep a monthly copy
          if [ "$(TZ=Asia/Bangkok date +%d)" = "01" ]; then
            rclone copy "prosun-db-$DAY.dump.gpg" "$DRIVE_ROOT/monthly/"
          fi
          rclone lsl "$DRIVE_ROOT/daily/" | tail -n 3

      - name: Remove old backups (30 days daily, 12 months monthly)
        run: |
          set -euo pipefail
          rclone delete "$DRIVE_ROOT/daily/"   --min-age 31d
          rclone delete "$DRIVE_ROOT/monthly/" --min-age 366d || true

      - name: Copy photos and bill scans (new files only)
        env:
          RCLONE_CONFIG_SUPA_TYPE: s3
          RCLONE_CONFIG_SUPA_PROVIDER: Other
          RCLONE_CONFIG_SUPA_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          RCLONE_CONFIG_SUPA_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_SUPA_REGION: ap-southeast-1
          RCLONE_CONFIG_SUPA_FORCE_PATH_STYLE: "true"
        run: |
          set -euo pipefail
          echo "Buckets in Supabase Storage:"
          rclone lsd supa:
          rclone copy supa: "$DRIVE_ROOT/storage/" --transfers 4 --checkers 8 --stats-one-line -v
          echo "Total in Drive storage copy:"
          rclone size "$DRIVE_ROOT/storage/"
